# ========================
# Buzzy Girly - Config
# ========================

spring.application.name=Buzzy Girly Store

# Server Port (Render provides PORT environment variable)
server.port=${PORT:8080}

# Database Configuration (supports H2 by default or MySQL / PostgreSQL in Production)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/generalstore;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console (disabled by default in production, can be toggled via H2_CONSOLE_ENABLED)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory (supports Render Persistent Disk mount point or local folder)
app.upload.dir=${UPLOAD_DIR:uploads}

