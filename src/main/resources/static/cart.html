<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Buzzy Girly</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="brand-logo-script">Buzzy Girly</span></a>
        <div class="nav-search"><span class="search-icon">🔍</span><input type="text" id="search-input" placeholder="Search products..."></div>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>
    <main class="main-content">
        <div class="page-title">
            <h1>Shopping Bag</h1>
        </div>
        <div class="cart-layout" id="cart-content">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-brand"><div class="brand-logo-script">Buzzy Girly</div></div>
        <p>&copy; 2025 Buzzy Girly Atelier. All Rights Reserved.</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        async function loadCart() {
            const container = document.getElementById('cart-content');

            try {
                const cart = await API.get('/api/cart');

                if (!cart.items || cart.items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">🛍️</div>
                            <h3>Your shopping bag is empty</h3>
                            <p>Start adding some luxurious products!</p>
                            <a href="/products.html" class="btn-secondary">Shop Our Collection</a>
                        </div>
                    `;
                    return;
                }

                const itemsHtml = cart.items.map(item => `
                    <div class="cart-item" data-product-id="${item.productId}">
                        <img src="${item.productImageUrl || ''}" alt="${item.productName}" 
                             onerror="this.style.display='none'">
                        <div class="item-details">
                            <h3>${item.productName}</h3>
                            <div class="item-price">${formatPrice(item.productPrice)}</div>
                            ${!item.productInStock ? '<span class="out-of-stock-badge" style="position:static;display:inline-block;margin-top:4px;">Out of Stock</span>' : ''}
                        </div>
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="updateQty(${item.productId}, ${item.quantity - 1})">-</button>
                            <span style="font-weight:600;min-width:24px;text-align:center;">${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQty(${item.productId}, ${item.quantity + 1})">+</button>
                        </div>
                        <div style="font-weight:700;min-width:80px;text-align:right;">${formatPrice(item.subtotal)}</div>
                        <button class="remove-btn" onclick="removeItem(${item.productId})">×</button>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="cart-items">${itemsHtml}</div>
                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div class="summary-row">
                            <span>Subtotal (${cart.items.length} items)</span>
                            <span>${formatPrice(cart.total)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span style="color:var(--teal);">Free</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span class="amount">${formatPrice(cart.total)}</span>
                        </div>
                        <button class="btn-checkout" onclick="window.location.href='/checkout.html'">
                            Proceed to Checkout →
                        </button>
                    </div>
                `;
            } catch {
                container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">⚠️</div><h3>Please login to view cart</h3><a href="/login.html" class="btn-secondary">Sign In</a></div>';
            }
        }

        async function updateQty(productId, newQty) {
            if (newQty < 1) {
                removeItem(productId);
                return;
            }
            try {
                await API.put('/api/cart', { productId, quantity: newQty });
                loadCart();
                updateBadges();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function removeItem(productId) {
            try {
                await API.delete(`/api/cart/${productId}`);
                showToast('Removed from cart', 'info');
                loadCart();
                updateBadges();
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
