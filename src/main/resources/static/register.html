<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Buzzy Girly</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>


    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="brand-logo-script">Buzzy Girly</span></a>
        <div class="nav-actions">
            <a href="/login.html" class="nav-btn-outline">Already a member? Sign In</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="auth-container" style="max-width: 480px;">
            <div class="brand-logo-script" style="font-size: 2.8rem; margin-bottom: 0.5rem;">Buzzy Girly</div>
            <h2>Create Your Account</h2>
            <p>Enter your details once. Next time, simply sign in with your username and password.</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="fullName">Your Full Name</label>
                    <input type="text" id="fullName" placeholder="e.g. Priya Sharma" required autofocus autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g. +91 98765 43210" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="username">Choose Username</label>
                    <input type="text" id="username" placeholder="e.g. priya_glow" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Choose Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit" id="register-btn">Complete Registration & Start Shopping →</button>
            </form>

            <div style="margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-light); font-size: 0.88rem; color: var(--text-muted);">
                Already have an account? 
                <a href="/login.html" style="font-weight: 600; color: var(--primary-rose-dark); text-decoration: underline;">Sign In here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top: 3rem; padding: 2.5rem 2rem;">
        <div style="text-align: center; font-size: 0.82rem; color: var(--text-muted);">
            &copy; 2025 Buzzy Girly Atelier. All Rights Reserved.
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await Auth.register({
                    fullName,
                    phone,
                    username,
                    password
                });

                if (res.id) {
                    showToast('Welcome to Buzzy Girly, ' + fullName + '! 🌸 Account created successfully.', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    showToast(res.message || 'Registration failed. Try a different username.', 'error');
                    btn.textContent = 'Complete Registration & Start Shopping →';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast(err.message || 'Registration failed. Please try again.', 'error');
                btn.textContent = 'Complete Registration & Start Shopping →';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
