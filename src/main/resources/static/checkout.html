<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Buzzy Girly</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="brand-logo-script">Buzzy Girly</span></a>
        <div class="nav-search"><span class="search-icon">🔍</span><input type="text" id="search-input" placeholder="Search products..."></div>
        <div class="nav-actions" id="nav-actions"></div>
    </nav>
    <main class="main-content">
        <div class="page-title">
            <h1>Secure Checkout</h1>
        </div>
        <div class="checkout-layout" id="checkout-content">
            <div class="loading-spinner" style="grid-column:1/-1;"><div class="spinner"></div></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-brand"><div class="brand-logo-script">Buzzy Girly</div></div>
        <p>&copy; 2025 Buzzy Girly Atelier. All Rights Reserved.</p>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        let selectedPayment = 'COD';

        async function loadCheckout() {
            const container = document.getElementById('checkout-content');

            try {
                const cart = await API.get('/api/cart');
                if (!cart.items || cart.items.length === 0) {
                    window.location.href = '/cart.html';
                    return;
                }

                const itemsHtml = cart.items.map(item => `
                    <div class="order-item">
                        <img src="${item.productImageUrl || ''}" alt="${item.productName}" onerror="this.style.display='none'">
                        <span class="item-name">${item.productName}</span>
                        <span class="item-qty">x${item.quantity}</span>
                        <span class="item-price">${formatPrice(item.subtotal)}</span>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="checkout-form">
                        <h2>Shipping Details</h2>
                        <div class="form-group">
                            <label for="customerName">Full Name</label>
                            <input type="text" id="customerName" class="form-control" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Shipping Address</label>
                            <textarea id="address" class="form-control" rows="3" placeholder="Enter your full address" required></textarea>
                        </div>

                        <h2 style="margin-top:2rem;">Payment Method</h2>
                        <div class="payment-options">
                            <div class="payment-option selected" style="cursor: default;">
                                <div class="icon">💵</div>
                                <div class="label">Cash on Delivery</div>
                                <span class="payment-badge-tag">Only Available</span>
                            </div>
                        </div>
                    </div>

                    <div class="cart-summary">
                        <h2>Order Summary</h2>
                        <div style="margin-bottom:1.5rem;">
                            ${itemsHtml}
                        </div>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>${formatPrice(cart.total)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span style="color:var(--teal);">Free</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span class="amount">${formatPrice(cart.total)}</span>
                        </div>
                        <button class="btn-checkout" onclick="placeOrder()" id="place-order-btn">
                            Place Order →
                        </button>
                    </div>
                `;
            } catch {
                container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">⚠️</div><h3>Please login first</h3><a href="/login.html" class="btn-secondary">Sign In</a></div>';
            }
        }

        function selectPayment(method, el) {
            selectedPayment = method;
            document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }

        async function placeOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();

            if (!name || !phone || !address) {
                showToast('Please fill in all shipping details', 'error');
                return;
            }

            const btn = document.getElementById('place-order-btn');
            btn.textContent = 'Placing order...';
            btn.disabled = true;

            try {
                const order = await API.post('/api/orders', {
                    customerName: name,
                    phone: phone,
                    shippingAddress: address,
                    paymentMethod: selectedPayment
                });

                showToast('Order placed successfully! 🌸', 'success');
                setTimeout(() => window.location.href = '/orders.html', 1500);
            } catch (e) {
                showToast(e.message || 'Failed to place order', 'error');
                btn.textContent = 'Place Order →';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCheckout);
    </script>
</body>
</html>
