<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Buzzy Girly</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>


    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="brand-logo-script">Buzzy Girly</span></a>
        <div class="nav-actions">
            <a href="/register.html" class="nav-user-btn">Create Account</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="auth-container">
            <div class="brand-logo-script" style="font-size: 2.8rem; margin-bottom: 0.5rem;">Buzzy Girly</div>
            <h2>Welcome Back</h2>
            <p>Enter your username and password to access your account</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="login-btn">Sign In to Buzzy Girly →</button>
            </form>

            <div style="margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-light); font-size: 0.88rem; color: var(--text-muted);">
                First time visiting Buzzy Girly? 
                <a href="/register.html" style="font-weight: 600; color: var(--primary-rose-dark); text-decoration: underline;">Create an account</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top: 3rem; padding: 2.5rem 2rem;">
        <div style="text-align: center; font-size: 0.82rem; color: var(--text-muted);">
            &copy; 2025 Buzzy Girly Atelier. All Rights Reserved.
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await Auth.login(username, password);
                if (res.id) {
                    showToast('Welcome back, ' + (res.fullName || res.username) + '! 🌸', 'success');
                    setTimeout(() => {
                        // Automatically redirect admin to admin section, otherwise customer section
                        if (res.role === 'OWNER') {
                            window.location.href = '/admin.html';
                        } else {
                            window.location.href = '/';
                        }
                    }, 500);
                } else {
                    showToast(res.message || 'Invalid username or password', 'error');
                    btn.textContent = 'Sign In to Buzzy Girly →';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast(err.message || 'Login failed. Please check credentials.', 'error');
                btn.textContent = 'Sign In to Buzzy Girly →';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
